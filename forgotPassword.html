<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – Lupa Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0D47A1;--primary-light:#1565C0;--font:'Plus Jakarta Sans',sans-serif;--radius:12px;--radius-lg:20px;--error:#ef4444;--success:#10b981}
body{font-family:var(--font);min-height:100vh;background:linear-gradient(135deg,#0D47A1 0%,#1565C0 50%,#0288D1 100%);display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.card{background:rgba(255,255,255,.97);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(13,71,161,.25);width:100%;max-width:420px;overflow:hidden;position:relative;z-index:1;animation:slideUp .5s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.card-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:32px 36px;position:relative;overflow:hidden}
.card-header::after{content:'';position:absolute;bottom:-30px;left:-10%;width:120%;height:60px;background:rgba(255,255,255,.97);border-radius:50%}
.back-link{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:16px;transition:color .2s}
.back-link:hover{color:white}
.back-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.header-icon{width:52px;height:52px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(255,255,255,.2)}
.header-icon svg{width:26px;height:26px;stroke:white;fill:none;stroke-width:1.8}
.card-header h1{color:white;font-size:22px;font-weight:800;letter-spacing:-.4px}
.card-header p{color:rgba(255,255,255,.7);font-size:13px;margin-top:4px}
.card-body{padding:32px 36px 36px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.input-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.form-control{width:100%;padding:11px 16px 11px 42px;border:1.5px solid #e2e8f0;border-radius:var(--radius);font-family:var(--font);font-size:14px;color:#1e293b;background:#f8fafc;transition:all .2s;outline:none}
.form-control:focus{border-color:var(--primary);background:white;box-shadow:0 0 0 3px rgba(13,71,161,.1)}
.form-control.no-icon{padding-left:16px}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,71,161,.35)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:18px;display:flex;align-items:flex-start;gap:9px}
.alert-error{background:#fef2f2;color:#b91c1c;border:1px solid #fee2e2}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.alert svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;margin-top:1px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.success-state{text-align:center;padding:10px 0}
.success-icon{width:72px;height:72px;background:#f0fdf4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.success-icon svg{width:36px;height:36px;stroke:var(--success);fill:none;stroke-width:2}
.success-title{font-size:20px;font-weight:800;color:#1e293b;margin-bottom:8px}
.success-desc{font-size:13px;color:#475569;line-height:1.6;margin-bottom:24px}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <a href="?page=login" class="back-link">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali ke Login
    </a>
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Lupa Password</h1>
    <p>Masukkan email untuk menerima link reset</p>
  </div>

  <div class="card-body">
    <div id="alertArea"></div>

    <div id="formForgot">
      <div class="form-group">
        <label class="form-label">Alamat Email</label>
        <div class="input-wrap">
          <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg></span>
          <input type="email" id="email" class="form-control" placeholder="email@perusahaan.com" autocomplete="email">
        </div>
      </div>
      <button class="btn-primary" id="btnSubmit" onclick="handleForgot()">Kirim Link Reset Password</button>
    </div>

    <div id="successState" style="display:none" class="success-state">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.61 4.35 2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div class="success-title">Email Terkirim!</div>
      <div class="success-desc">Jika email tersebut terdaftar di sistem, Anda akan menerima link reset password dalam beberapa menit. Periksa folder spam jika tidak ada di inbox.</div>
      <button class="btn-primary" onclick="window.location.href='?page=login'" style="max-width:240px;margin:0 auto;display:block">Kembali ke Login</button>
    </div>
  </div>
</div>

<script>
const APP_URL = '<!-- GitHub Pages - URL via config.js -->';

document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') handleForgot(); });

async function handleForgot() {
  const email = document.getElementById('email').value.trim();
  clearAlert();
  if (!email || !email.includes('@')) { showAlert('Masukkan alamat email yang valid.', 'error'); return; }
  
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mengirim...';
  
  try {
    const res = await callAPI('forgotPassword', { email });
    if (res.success) {
      document.getElementById('formForgot').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } else {
      showAlert(res.error || 'Terjadi kesalahan.', 'error');
      btn.disabled = false; btn.textContent = 'Kirim Link Reset Password';
    }
  } catch (e) {
    showAlert('Gagal terhubung ke server.', 'error');
    btn.disabled = false; btn.textContent = 'Kirim Link Reset Password';
  }
}

function showAlert(msg, type) {
  document.getElementById('alertArea').innerHTML = `
    <div class="alert alert-${type}">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>
      <span>${msg}</span>
    </div>`;
}

function clearAlert() { document.getElementById('alertArea').innerHTML = ''; }

function callAPI(action, payload) {
  return fetch(APP_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, ...payload}) }).then(r => r.json());
}
</script>
</body>
</html>
