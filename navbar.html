<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<script>
// Init navbar after load
(function initNavbar() {
  if (typeof getUser !== 'function') {
    // config.js belum load, coba lagi
    setTimeout(initNavbar, 100);
    return;
  }

  const user = getUser();
  if (!user || !user.name) return;

  // Set user info
  document.getElementById('navUserName').textContent = user.name;
  document.getElementById('navUserAvatar').textContent = user.name.charAt(0).toUpperCase();
  const roleEl = document.getElementById('navUserRole');
  if (roleEl) {
    roleEl.textContent = user.role || 'ADMIN';
    roleEl.className = 'user-role ' + (user.role === 'HRD' ? 'role-hrd' : 'role-admin');
  }

  // Show HRD menus
  if (user.role === 'HRD') {
    const hrdMenus = document.getElementById('navHrdMenus');
    if (hrdMenus) hrdMenus.style.display = 'block';
  }

  // Active nav item — detect from current page filename
  const currentPage = window.location.pathname.split('/').pop().replace('.html','');
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.classList.toggle('active', el.dataset.page === currentPage);
  });

  // Set company name in header if element exists
  const cnEl = document.getElementById('headerCompanyName');
  if (cnEl && user.tenantId) {
    cnEl.textContent = user.company || 'Perusahaan';
  }
})();

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const header = document.querySelector('.main-header');
  const content = document.querySelector('.main-content');

  if (window.innerWidth <= 768) {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  } else {
    sidebar.classList.toggle('collapsed');
    if (header) header.classList.toggle('full');
    if (content) content.classList.toggle('full');
  }
}

async function handleLogout() {
  try { await callAPI('logout', {}); } catch (e) {}
  clearSession();
  window.location.href = 'login.html';
}
</script>
