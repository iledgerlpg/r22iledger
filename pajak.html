<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – Pajak Kendaraan</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/pajak.js"></script>
<script src="js/page-template.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>window.CURRENT_PAGE = 'pajak';</script>
<!-- FIX: style tetap di <head>, tapi navbarMount dipindah ke <body> -->
<style>
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.status-aman{background:#dcfce7;color:#166534}
.status-warning{background:#fef3c7;color:#92400e}
.status-danger{background:#fee2e2;color:#991b1b}
.status-na{background:var(--gray-100);color:var(--gray-400)}
.pajak-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-color);overflow:hidden;transition:transform .2s,box-shadow .2s}
.pajak-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.pajak-card-top{padding:16px 18px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.pajak-nopol{font-size:16px;font-weight:800;color:var(--text-primary);letter-spacing:.5px}
.pajak-card-body{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pajak-item .pi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);margin-bottom:3px}
.pajak-item .pi-value{font-size:13px;font-weight:600;color:var(--text-primary)}
.pajak-item .pi-days{font-size:11px;margin-top:2px}
.pajak-card-footer{padding:10px 18px;border-top:1px solid var(--border-color);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.countdown-ring{position:relative;width:48px;height:48px;flex-shrink:0}
.countdown-ring svg{transform:rotate(-90deg)}
.countdown-ring .ring-bg{fill:none;stroke:var(--gray-200);stroke-width:3}
.countdown-ring .ring-fill{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.countdown-ring .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--text-primary)}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border-color);background:transparent;font-family:var(--font);font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.chip.active{border-color:var(--primary);background:var(--primary);color:white}
.chip.danger-chip.active{border-color:var(--error);background:var(--error);color:white}
.chip.warning-chip.active{border-color:var(--warning);background:var(--warning);color:white}
.alert-strip{border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500}
.alert-strip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.alert-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fee2e2}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
</style>
</head>
<body>

<!-- FIX: navbarMount dipindah ke <body> (sebelumnya ada di dalam <head> yang salah) -->
<div id="navbarMount"></div>

<header class="main-header">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Pajak Kendaraan</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg>
    </button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1 class="page-title">Pajak Kendaraan</h1>
        <p class="page-subtitle">Pantau STNK & KIR semua armada secara real-time</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> PDF
        </button>
        <button class="btn btn-primary btn-sm" onclick="loadData()">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.98"/></svg> Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- KPI Row -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px">
    <div class="kpi-card"><div class="kpi-icon" style="background:#DCFCE7;color:#16A34A"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="kpi-label">Aman</div><div class="kpi-value sm" id="statAman" style="color:var(--success)">-</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="background:#FEF3C7;color:#D97706"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div><div><div class="kpi-label">Segera Jatuh</div><div class="kpi-value sm" id="statWarn" style="color:var(--warning)">-</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="background:#FEE2E2;color:#DC2626"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div><div class="kpi-label">Terlambat</div><div class="kpi-value sm" id="statLate" style="color:var(--error)">-</div></div></div>
    <div class="kpi-card"><div class="kpi-icon" style="background:#DBEAFE;color:#1D4ED8"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="kpi-label">Total Armada</div><div class="kpi-value sm" id="statTotal">-</div></div></div>
  </div>

  <!-- Alert strips -->
  <div id="alertStrips"></div>

  <!-- Filter Chips -->
  <div class="filter-chips">
    <button class="chip active" onclick="setFilter('all', this)">Semua</button>
    <button class="chip warning-chip" onclick="setFilter('warning', this)">⚠️ Segera (≤30 hari)</button>
    <button class="chip danger-chip" onclick="setFilter('danger', this)">🚨 Terlambat</button>
  </div>

  <!-- Search -->
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <div class="search-bar" style="flex:1;min-width:200px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Cari no. polisi..." oninput="applyFilter()">
    </div>
  </div>

  <div id="pajakGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px"></div>
</main>

<!-- MODAL EDIT PAJAK -->
<div class="modal-overlay" id="modalEdit">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title" id="modalEditTitle">Update Tanggal Pajak</h3>
      <button class="modal-close" onclick="closeModal('modalEdit')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editPajakId">
      <div style="background:var(--gray-50);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text-secondary)">
        Update tanggal setelah melakukan perpanjangan/pembayaran pajak.
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Tanggal STNK Baru</label>
        <input type="date" id="fTglSTNK" class="form-control-m">
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Tanggal KIR Baru</label>
        <input type="date" id="fTglKIR" class="form-control-m">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalEdit')">Batal</button>
      <button class="btn btn-primary" id="btnSavePajak" onclick="savePajak()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

</body>
</html>
