<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#0D47A1;--primary-light:#1565C0;--font:'Plus Jakarta Sans',sans-serif;--radius:12px;--radius-lg:20px;--error:#ef4444;--success:#10b981}
body{font-family:var(--font);min-height:100vh;background:linear-gradient(135deg,#0D47A1,#1565C0 50%,#0288D1);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.97);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(13,71,161,.25);width:100%;max-width:420px;overflow:hidden;position:relative;z-index:1;animation:slideUp .5s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.card-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:32px 36px;position:relative;overflow:hidden}
.card-header::after{content:'';position:absolute;bottom:-30px;left:-10%;width:120%;height:60px;background:rgba(255,255,255,.97);border-radius:50%}
.header-icon{width:52px;height:52px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(255,255,255,.2)}
.header-icon svg{width:26px;height:26px;stroke:white;fill:none;stroke-width:1.8}
.card-header h1{color:white;font-size:22px;font-weight:800;letter-spacing:-.4px}
.card-header p{color:rgba(255,255,255,.7);font-size:13px;margin-top:4px}
.card-body{padding:32px 36px 36px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.input-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.form-control{width:100%;padding:11px 40px 11px 42px;border:1.5px solid #e2e8f0;border-radius:var(--radius);font-family:var(--font);font-size:14px;color:#1e293b;background:#f8fafc;transition:all .2s;outline:none}
.form-control:focus{border-color:var(--primary);background:white;box-shadow:0 0 0 3px rgba(13,71,161,.1)}
.form-control.error{border-color:var(--error)}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;transition:color .2s}
.pw-toggle:hover{color:var(--primary)}
.pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.strength-bar{display:flex;gap:4px;margin-top:8px}
.strength-seg{height:4px;flex:1;border-radius:2px;background:#e2e8f0;transition:background .3s}
.strength-txt{font-size:11px;color:#94a3b8;margin-top:4px}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,71,161,.35)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:18px;display:flex;align-items:flex-start;gap:9px}
.alert-error{background:#fef2f2;color:#b91c1c;border:1px solid #fee2e2}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.alert svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;margin-top:1px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.req-list{background:#f8fafc;border-radius:8px;padding:12px 14px;margin-bottom:16px;border:1px solid #e2e8f0}
.req-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8;margin-bottom:4px;transition:color .2s}
.req-item:last-child{margin:0}
.req-item.met{color:#16a34a}
.req-item svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;flex-shrink:0}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    </div>
    <h1>Reset Password</h1>
    <p>Buat password baru yang kuat dan aman</p>
  </div>

  <div class="card-body">
    <div id="alertArea"></div>

    <div id="formReset">
      <div class="form-group">
        <label class="form-label">Password Baru</label>
        <div class="input-wrap">
          <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="newPassword" class="form-control" placeholder="Masukkan password baru" oninput="checkStrength()">
          <button class="pw-toggle" onclick="togglePwd('newPassword')">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-txt" id="strengthTxt">Masukkan password</div>
      </div>

      <div class="req-list">
        <div class="req-item" id="req-length">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Minimal 8 karakter
        </div>
        <div class="req-item" id="req-upper">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>
          Mengandung huruf kapital (A-Z)
        </div>
        <div class="req-item" id="req-number">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>
          Mengandung angka (0-9)
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Konfirmasi Password</label>
        <div class="input-wrap">
          <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru">
          <button class="pw-toggle" onclick="togglePwd('confirmPassword')">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="btnReset" onclick="handleReset()">Reset Password</button>
    </div>

    <div id="successState" style="display:none;text-align:center;padding:10px 0">
      <div style="width:72px;height:72px;background:#f0fdf4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg viewBox="0 0 24 24" width="36" height="36" stroke="#10b981" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style="font-size:20px;font-weight:800;color:#1e293b;margin-bottom:8px">Password Berhasil Diubah!</div>
      <div style="font-size:13px;color:#475569;line-height:1.6;margin-bottom:24px">Password Anda telah berhasil diperbarui. Silakan login dengan password baru.</div>
      <button class="btn-primary" onclick="window.location.href='?page=login'" style="max-width:220px;margin:0 auto;display:block">Login Sekarang</button>
    </div>
  </div>
</div>

<script>
const APP_URL = '<!-- GitHub Pages - URL via config.js -->';
const resetToken = new URLSearchParams(location.search).get('token') || '';

if (!resetToken) {
  document.getElementById('alertArea').innerHTML = '<div class="alert alert-error"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg><span>Token tidak valid atau sudah kadaluarsa. <a href="?page=forgot-password" style="color:var(--primary);font-weight:600">Minta link baru</a></span></div>';
  document.getElementById('formReset').style.display = 'none';
}

function togglePwd(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'text' ? 'password' : 'text';
}

function checkStrength() {
  const pwd = document.getElementById('newPassword').value;
  const colors = ['', '#ef4444','#f59e0b','#3b82f6','#10b981'];
  const labels = ['','Lemah','Cukup','Kuat','Sangat Kuat'];
  let score = 0;
  if (pwd.length >= 8) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  
  ['seg1','seg2','seg3','seg4'].forEach((id, i) => {
    document.getElementById(id).style.background = i < score ? colors[score] : '#e2e8f0';
  });
  document.getElementById('strengthTxt').textContent = pwd ? labels[score] : 'Masukkan password';
  document.getElementById('strengthTxt').style.color = colors[score] || '#94a3b8';
  
  // Req checklist
  const reqLength = document.getElementById('req-length');
  const reqUpper = document.getElementById('req-upper');
  const reqNumber = document.getElementById('req-number');
  const checkIcon = '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
  const failIcon = '<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>';
  
  [
    [reqLength, pwd.length >= 8, 'Minimal 8 karakter'],
    [reqUpper, /[A-Z]/.test(pwd), 'Mengandung huruf kapital (A-Z)'],
    [reqNumber, /[0-9]/.test(pwd), 'Mengandung angka (0-9)']
  ].forEach(([el, met, label]) => {
    el.classList.toggle('met', met);
    el.innerHTML = (met ? checkIcon : failIcon) + ' ' + label;
  });
}

async function handleReset() {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  clearAlert();
  
  if (newPassword.length < 8) { showAlert('Password minimal 8 karakter.','error'); return; }
  if (newPassword !== confirmPassword) { showAlert('Konfirmasi password tidak cocok.','error'); document.getElementById('confirmPassword').classList.add('error'); return; }
  
  const btn = document.getElementById('btnReset');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Menyimpan...';
  
  try {
    const res = await callAPI('resetPassword', { resetToken, newPassword });
    if (res.success) {
      document.getElementById('formReset').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } else {
      showAlert(res.error || 'Terjadi kesalahan.','error');
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
  } catch(e) {
    showAlert('Gagal terhubung ke server.','error');
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
}

function showAlert(msg, type) {
  document.getElementById('alertArea').innerHTML = `
    <div class="alert alert-${type}">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <span>${msg}</span>
    </div>`;
}

function clearAlert() { document.getElementById('alertArea').innerHTML = ''; }

function callAPI(action, payload) {
  return fetch(APP_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, ...payload}) }).then(r => r.json());
}
</script>
</body>
</html>
