<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iLedgerV2 – Kelola Karyawan</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/page-template.js"></script>
  <script src="js/karyawan.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script> window.CURRENT_PAGE='karyawan';</script>
  
  <style>
    .karyawan-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-color);overflow:hidden;transition:transform .2s,box-shadow .2s}
    .karyawan-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .karyawan-header-bar{height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
    .karyawan-body{padding:18px}
    .karyawan-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:white;margin-bottom:12px;flex-shrink:0}
    .karyawan-name{font-size:15px;font-weight:700;color:var(--text-primary)}
    .karyawan-jabatan{font-size:12px;color:var(--text-secondary);margin-bottom:12px}
    .karyawan-details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .kd-item .kd-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary)}
    .kd-item .kd-value{font-size:12px;font-weight:600;color:var(--text-primary);margin-top:1px}
    .karyawan-footer{padding:12px 18px;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
    .gaji-display{font-size:13px;font-weight:800;color:var(--success)}
    .search-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
    .filter-select{padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--bg-card);cursor:pointer;outline:none}
    .karyawan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .avatar-colors{--c1:#0D47A1;--c2:#1565C0;--c3:#0288D1;--c4:#00838F;--c5:#558B2F;--c6:#6A1B9A}
  </style>
</head>
<body>

<div id="navbarMount"></div>

<header class="main-header">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Kelola Karyawan</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg></button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1 class="page-title">Kelola Karyawan</h1>
        <p class="page-subtitle">Manajemen data karyawan perusahaan (Akses: HRD)</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> PDF
        </button>
        <button class="btn btn-primary" onclick="openModal('modalKaryawan')">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Karyawan
        </button>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px">
    <div class="kpi-card">
      <div class="kpi-icon" style="background:#DBEAFE;color:#1D4ED8">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <div class="kpi-label">Total Karyawan</div>
        <div class="kpi-value sm" id="statTotal">-</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:#DCFCE7;color:#16A34A">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div>
        <div class="kpi-label">Aktif</div>
        <div class="kpi-value sm" id="statAktif">-</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:#FEF3C7;color:#D97706">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div>
        <div class="kpi-label">Total Gaji / Bulan</div>
        <div class="kpi-value sm" id="statGaji">-</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:#F5F3FF;color:#7C3AED">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
      </div>
      <div>
        <div class="kpi-label">Tidak Aktif</div>
        <div class="kpi-value sm" id="statNonaktif">-</div>
      </div>
    </div>
  </div>

  <div class="search-toolbar">
    <div class="search-bar" style="flex:1;min-width:200px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Cari nama, NIK, jabatan..." oninput="debounceSearch()">
    </div>
    <select class="filter-select" id="filterStatus" onchange="loadData()">
      <option value="">Semua Status</option>
      <option value="ACTIVE">Aktif</option>
      <option value="INACTIVE">Tidak Aktif</option>
    </select>
    <span style="font-size:12px;color:var(--text-secondary)" id="resultInfo">-</span>
  </div>

  <div class="karyawan-grid" id="karyawanGrid"></div>
</main>

<div class="modal-overlay" id="modalKaryawan">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Tambah Karyawan</h3>
      <button class="modal-close" onclick="closeModal('modalKaryawan');resetForm()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <input type="hidden" id="editId">

      <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Data Pribadi</div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">NIK <span style="color:var(--error)">*</span></label>
          <input type="text" id="fNIK" class="form-control-m" placeholder="3201234567890001">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Nama Lengkap <span style="color:var(--error)">*</span></label>
          <input type="text" id="fNama" class="form-control-m" placeholder="Nama lengkap">
        </div>
      </div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Jenis Kelamin</label>
          <select id="fJK" class="form-control-m">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">No. Telepon</label>
          <input type="tel" id="fNoTelp" class="form-control-m" placeholder="08123456789">
        </div>
      </div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Tempat Lahir</label>
          <input type="text" id="fTempatLahir" class="form-control-m" placeholder="Bandung">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Tanggal Lahir</label>
          <input type="date" id="fTglLahir" class="form-control-m">
        </div>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Alamat</label>
        <textarea id="fAlamat" class="form-control-m" rows="2" style="resize:none" placeholder="Alamat lengkap tempat tinggal"></textarea>
      </div>

      <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px">Pekerjaan & Kontrak</div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Jabatan <span style="color:var(--error)">*</span></label>
          <input type="text" id="fJabatan" class="form-control-m" placeholder="Driver / Admin / Manager">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Departemen</label>
          <select id="fDepartemen" class="form-control-m">
            <option value="Operasional">Operasional</option>
            <option value="Administrasi">Administrasi</option>
            <option value="Keuangan">Keuangan</option>
            <option value="HRD">HRD</option>
            <option value="IT">IT</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Tanggal Masuk</label>
          <input type="date" id="fTglMasuk" class="form-control-m">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Gaji Pokok (Rp)</label>
          <input type="number" id="fGaji" class="form-control-m" placeholder="5000000" min="0">
        </div>
      </div>

      <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px">BPJS & Rekening</div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">No. BPJS Kesehatan</label>
          <input type="text" id="fBPJSKES" class="form-control-m" placeholder="0001234567890">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">No. BPJS Ketenagakerjaan</label>
          <input type="text" id="fBPJSTK" class="form-control-m" placeholder="09987654321">
        </div>
      </div>
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">No. Rekening</label>
          <input type="text" id="fNoRek" class="form-control-m" placeholder="1234567890">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Nama Bank</label>
          <select id="fNamaBank" class="form-control-m">
            <option value="">-- Pilih Bank --</option>
            <option value="BCA">BCA</option>
            <option value="BRI">BRI</option>
            <option value="Mandiri">Mandiri</option>
            <option value="BNI">BNI</option>
            <option value="CIMB Niaga">CIMB Niaga</option>
            <option value="Danamon">Danamon</option>
            <option value="BTN">BTN</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
      </div>

      <div id="editStatusField" style="display:none">
        <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px">Status Pemutusan Kontrak</div>
        <div class="form-row-m">
          <div class="form-group-m">
            <label class="form-label-m">Status Karyawan</label>
            <select id="fStatus" class="form-control-m">
              <option value="ACTIVE">Aktif</option>
              <option value="INACTIVE">Tidak Aktif</option>
              <option value="RESIGN">Resign</option>
            </select>
          </div>
          <div class="form-group-m">
            <label class="form-label-m">Tanggal Keluar</label>
            <input type="date" id="fTglKeluar" class="form-control-m">
          </div>
        </div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalKaryawan');resetForm()">Batal</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveData()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Jalankan engine page-template, tunggu fetch navbar.html selesai total
    await initPage('karyawan'); 
    
    // 2. Jika fungsi inisialisasi di karyawan.js tersedia, eksekusi secara aman
    if (typeof initKaryawanPage === 'function') {
      initKaryawanPage();
    }
  });
</script>

</body>
</html>
