<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – User Management</title>
<link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="r22.png">
<script src="js/config.js"></script>
<script src="js/user.js"></script>
<script src="js/page-template.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script> window.CURRENT_PAGE='user-management';</script>
<div id="navbarMount"></div>
<style>
.user-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border-color);padding:20px;display:flex;align-items:flex-start;gap:16px;transition:box-shadow .2s}
.user-card:hover{box-shadow:var(--shadow-md)}
.user-avatar-lg{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white;flex-shrink:0}
.user-info-main{flex:1;min-width:0}
.user-name-lg{font-size:15px;font-weight:700;color:var(--text-primary)}
.user-email-lg{font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.user-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.users-grid{display:flex;flex-direction:column;gap:12px}
.pending-banner{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1.5px solid #fde68a;border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.pending-banner svg{width:24px;height:24px;stroke:#D97706;fill:none;stroke-width:2;flex-shrink:0}
.pending-banner .pb-text{font-size:14px;font-weight:600;color:#92400e}
.pending-banner .pb-count{background:#D97706;color:white;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;margin-left:8px}
</style>
</head>
<body>

<header class="main-header">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">User Management</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg></button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <h1 class="page-title">User Management</h1>
    <p class="page-subtitle">Kelola pengguna dan approval akun (Akses: HRD)</p>
  </div>

  <div id="pendingBanner" style="display:none" class="pending-banner">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span class="pb-text">Ada pengguna menunggu persetujuan <span class="pb-count" id="pendingCount">0</span></span>
  </div>

  <!-- Filter -->
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center">
    <div class="search-bar" style="flex:1;min-width:200px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Cari nama atau email..." oninput="filterUsers()">
    </div>
    <select id="filterStatus" style="padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;outline:none" onchange="filterUsers()">
      <option value="">Semua Status</option>
      <option value="PENDING">Menunggu</option>
      <option value="ACTIVE">Aktif</option>
      <option value="REJECTED">Ditolak</option>
      <option value="INACTIVE">Nonaktif</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="loadData()">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.98"/></svg>
      Refresh
    </button>
  </div>

  <div class="users-grid" id="usersGrid"></div>
</main>

<!-- Modal Reject -->
<div class="modal-overlay" id="modalReject">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3 class="modal-title">Tolak Pengguna</h3>
      <button class="modal-close" onclick="closeModal('modalReject')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rejectUserId">
      <div class="form-group-m">
        <label class="form-label-m">Alasan Penolakan (opsional)</label>
        <textarea id="rejectReason" class="form-control-m" rows="3" style="resize:none" placeholder="Masukkan alasan penolakan..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalReject')">Batal</button>
      <button class="btn btn-danger" onclick="confirmReject()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Tolak
      </button>
    </div>
  </div>
</div>


</body>
</html>
