<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – Pemasukan</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/pemasukan.js"></script>
<script src="js/page-template.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script> window.CURRENT_PAGE='pemasukan';</script>
<div id="navbarMount"></div>
<style>
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.filter-select{padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--bg-card);cursor:pointer;outline:none;transition:border-color .2s;min-width:140px}
.filter-select:focus{border-color:var(--primary)}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.summary-item{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color);padding:14px 16px}
.summary-item .s-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary)}
.summary-item .s-value{font-size:16px;font-weight:800;color:var(--text-primary);margin-top:4px;letter-spacing:-.3px}
.upload-zone{border:2px dashed var(--border-color);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50);position:relative}
.upload-zone:hover{border-color:var(--primary);background:rgba(13,71,161,.03)}
.upload-zone svg{width:28px;height:28px;stroke:var(--gray-400);fill:none;stroke-width:1.5;margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--text-secondary)}
.upload-zone p strong{color:var(--primary)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{position:relative;margin-top:10px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--border-color)}
.upload-preview img{width:100%;max-height:160px;object-fit:cover;display:block}
.upload-preview-remove{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.6);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-preview-remove svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.nota-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:1.5px solid var(--border-color);transition:transform .2s}
.nota-thumb:hover{transform:scale(1.1)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty-state svg{width:56px;height:56px;stroke:var(--gray-200);fill:none;stroke-width:1.5;margin-bottom:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.show{opacity:1;pointer-events:all}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){.summary-bar{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>

<header class="main-header" id="mainHeader">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Pendapatan</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/></svg>
    </button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1 class="page-title">Pendapatan</h1>
        <p class="page-subtitle">Kelola semua transaksi pemasukan perusahaan</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
        <button class="btn btn-primary" onclick="openModal('modalAdd')">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Pendapatan
        </button>
      </div>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-item"><div class="s-label">Total Pendapatan</div><div class="s-value" id="sumTotal" style="color:var(--success)">Rp 0</div></div>
    <div class="summary-item"><div class="s-label">Jumlah Transaksi</div><div class="s-value" id="sumCount">0</div></div>
    <div class="summary-item"><div class="s-label">Rata-rata</div><div class="s-value" id="sumAvg">Rp 0</div></div>
    <div class="summary-item"><div class="s-label">Terbesar</div><div class="s-value" id="sumMax">Rp 0</div></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-bar" style="min-width:240px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" placeholder="Cari nama, uraian..." id="searchInput" oninput="debounceSearch()">
      </div>
      <input type="month" class="filter-select" id="filterMonth" onchange="loadData()" style="min-width:160px">
    </div>
    <div class="toolbar-right">
      <span style="font-size:12px;color:var(--text-secondary)" id="resultInfo">-</span>
      <select class="filter-select" id="limitSelect" onchange="loadData()" style="min-width:100px">
        <option value="10">10/hal</option>
        <option value="20" selected>20/hal</option>
        <option value="50">50/hal</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>No</th><th>Tanggal</th><th>Nama</th><th>Uraian</th>
            <th>Nominal</th><th>Bukti</th><th>Oleh</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-secondary)" id="pageInfo">-</span>
      <div id="paginationContainer" style="display:flex;gap:6px"></div>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalAdd">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Tambah Pendapatan</h3>
      <button class="modal-close" onclick="closeModal('modalAdd');resetForm()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Tanggal & Waktu <span style="color:var(--error)">*</span></label>
          <input type="datetime-local" id="fTimestamp" class="form-control-m">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Nominal (Rp) <span style="color:var(--error)">*</span></label>
          <input type="number" id="fNominal" class="form-control-m" placeholder="0" min="0" oninput="previewNominal()">
        </div>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Nama Pengirim / Sumber <span style="color:var(--error)">*</span></label>
        <input type="text" id="fNama" class="form-control-m" placeholder="Nama customer / sumber pendapatan">
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Uraian / Keterangan <span style="color:var(--error)">*</span></label>
        <textarea id="fUraian" class="form-control-m" rows="2" placeholder="Contoh: Pembayaran tagihan bulan Juni 2024" style="resize:none"></textarea>
      </div>
      <div id="nomPreview" style="display:none;background:#f0fdf4;border-radius:var(--radius);padding:10px;text-align:center;font-size:17px;font-weight:800;color:var(--success);margin-bottom:12px"></div>
      <div class="form-group-m">
        <label class="form-label-m">Bukti Transfer / Pembayaran</label>
        <div class="upload-zone" id="uploadBukti">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p><strong>Klik atau drag</strong> file gambar</p>
          <p>JPG, PNG (max 5MB)</p>
          <input type="file" accept="image/*" onchange="handleFileSelect(event)">
        </div>
        <div id="previewBukti" style="display:none" class="upload-preview">
          <img id="previewBuktiImg" src="" alt="Bukti">
          <button class="upload-preview-remove" onclick="removeFile()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalAdd');resetForm()">Batal</button>
      <button class="btn btn-success" id="btnSave" onclick="saveData()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="Preview">
</div>

</body>
</html>
