<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iLedgerV2 – Pemasukan</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/page-template.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script> window.CURRENT_PAGE='pemasukan';</script>
<div id="navbarMount"></div>
<style>
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar-left{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.filter-select{padding:9px 14px;border:1.5px solid var(--border-color);border-radius:var(--radius);font-family:var(--font);font-size:13px;color:var(--text-primary);background:var(--bg-card);cursor:pointer;outline:none;transition:border-color .2s;min-width:140px}
.filter-select:focus{border-color:var(--primary)}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.summary-item{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color);padding:14px 16px}
.summary-item .s-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary)}
.summary-item .s-value{font-size:16px;font-weight:800;color:var(--text-primary);margin-top:4px;letter-spacing:-.3px}
.upload-zone{border:2px dashed var(--border-color);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50);position:relative}
.upload-zone:hover{border-color:var(--primary);background:rgba(13,71,161,.03)}
.upload-zone svg{width:28px;height:28px;stroke:var(--gray-400);fill:none;stroke-width:1.5;margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--text-secondary)}
.upload-zone p strong{color:var(--primary)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{position:relative;margin-top:10px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--border-color)}
.upload-preview img{width:100%;max-height:160px;object-fit:cover;display:block}
.upload-preview-remove{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.6);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.upload-preview-remove svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.nota-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:1.5px solid var(--border-color);transition:transform .2s}
.nota-thumb:hover{transform:scale(1.1)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty-state svg{width:56px;height:56px;stroke:var(--gray-200);fill:none;stroke-width:1.5;margin-bottom:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.show{opacity:1;pointer-events:all}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){.summary-bar{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>

<header class="main-header" id="mainHeader">
  <button class="header-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-breadcrumb">
    <span>iLedgerV2</span><span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Pendapatan</span>
  </div>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/></svg>
    </button>
  </div>
</header>

<main class="main-content" id="mainContent">
  <div class="page-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1 class="page-title">Pendapatan</h1>
        <p class="page-subtitle">Kelola semua transaksi pemasukan perusahaan</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
        <button class="btn btn-primary" onclick="openModal('modalAdd')">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Pendapatan
        </button>
      </div>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-item"><div class="s-label">Total Pendapatan</div><div class="s-value" id="sumTotal" style="color:var(--success)">Rp 0</div></div>
    <div class="summary-item"><div class="s-label">Jumlah Transaksi</div><div class="s-value" id="sumCount">0</div></div>
    <div class="summary-item"><div class="s-label">Rata-rata</div><div class="s-value" id="sumAvg">Rp 0</div></div>
    <div class="summary-item"><div class="s-label">Terbesar</div><div class="s-value" id="sumMax">Rp 0</div></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-bar" style="min-width:240px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" placeholder="Cari nama, uraian..." id="searchInput" oninput="debounceSearch()">
      </div>
      <input type="month" class="filter-select" id="filterMonth" onchange="loadData()" style="min-width:160px">
    </div>
    <div class="toolbar-right">
      <span style="font-size:12px;color:var(--text-secondary)" id="resultInfo">-</span>
      <select class="filter-select" id="limitSelect" onchange="loadData()" style="min-width:100px">
        <option value="10">10/hal</option>
        <option value="20" selected>20/hal</option>
        <option value="50">50/hal</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>No</th><th>Tanggal</th><th>Nama</th><th>Uraian</th>
            <th>Nominal</th><th>Bukti</th><th>Oleh</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span style="font-size:12px;color:var(--text-secondary)" id="pageInfo">-</span>
      <div id="paginationContainer" style="display:flex;gap:6px"></div>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalAdd">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Tambah Pendapatan</h3>
      <button class="modal-close" onclick="closeModal('modalAdd');resetForm()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row-m">
        <div class="form-group-m">
          <label class="form-label-m">Tanggal & Waktu <span style="color:var(--error)">*</span></label>
          <input type="datetime-local" id="fTimestamp" class="form-control-m">
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Nominal (Rp) <span style="color:var(--error)">*</span></label>
          <input type="number" id="fNominal" class="form-control-m" placeholder="0" min="0" oninput="previewNominal()">
        </div>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Nama Pengirim / Sumber <span style="color:var(--error)">*</span></label>
        <input type="text" id="fNama" class="form-control-m" placeholder="Nama customer / sumber pendapatan">
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Uraian / Keterangan <span style="color:var(--error)">*</span></label>
        <textarea id="fUraian" class="form-control-m" rows="2" placeholder="Contoh: Pembayaran tagihan bulan Juni 2024" style="resize:none"></textarea>
      </div>
      <div id="nomPreview" style="display:none;background:#f0fdf4;border-radius:var(--radius);padding:10px;text-align:center;font-size:17px;font-weight:800;color:var(--success);margin-bottom:12px"></div>
      <div class="form-group-m">
        <label class="form-label-m">Bukti Transfer / Pembayaran</label>
        <div class="upload-zone" id="uploadBukti">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p><strong>Klik atau drag</strong> file gambar</p>
          <p>JPG, PNG (max 5MB)</p>
          <input type="file" accept="image/*" onchange="handleFileSelect(event)">
        </div>
        <div id="previewBukti" style="display:none" class="upload-preview">
          <img id="previewBuktiImg" src="" alt="Bukti">
          <button class="upload-preview-remove" onclick="removeFile()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modalAdd');resetForm()">Batal</button>
      <button class="btn btn-success" id="btnSave" onclick="saveData()">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="Preview">
</div>

<script>
let currentPage = 1, totalPages = 1;
let selectedBuktiBase64 = null, selectedBuktiMime = null;
let searchTimeout = null;

document.addEventListener('DOMContentLoaded', () => {
  setDefaultDT();
  loadData();
});

function setDefaultDT() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('fTimestamp').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('filterMonth').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
}

async function loadData() {
  showSkeleton('tableBody', 5);
  const res = await callAPI('getPemasukan', {
    page: currentPage, limit: document.getElementById('limitSelect').value,
    search: document.getElementById('searchInput').value,
    filterMonth: document.getElementById('filterMonth').value
  });
  if (!res.success) { showToast('Gagal memuat data.','error'); return; }
  totalPages = res.totalPages || 1;
  document.getElementById('resultInfo').textContent = `${res.total} data`;
  document.getElementById('pageInfo').textContent = `Hal ${res.page} dari ${totalPages}`;
  renderTable(res.data, res.page, parseInt(document.getElementById('limitSelect').value));
  renderPagination('paginationContainer', currentPage, totalPages, 'changePage');
  updateSummary(res.data);
}

function updateSummary(data) {
  const total = data.reduce((s,r) => s + r.nominal, 0);
  const max = data.length ? Math.max(...data.map(r => r.nominal)) : 0;
  document.getElementById('sumTotal').textContent = formatRupiah(total);
  document.getElementById('sumCount').textContent = data.length + ' transaksi';
  document.getElementById('sumAvg').textContent = formatRupiah(data.length ? Math.round(total / data.length) : 0);
  document.getElementById('sumMax').textContent = formatRupiah(max);
}

function renderTable(data, page, limit) {
  const tbody = document.getElementById('tableBody');
  if (!data || !data.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><h3>Belum ada pendapatan</h3><p>Klik "Tambah Pendapatan" untuk mencatat</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map((r, i) => {
    const no = (page - 1) * limit + i + 1;
    const buktiHtml = r.buktiTransferURL
      ? `<img class="nota-thumb" src="${r.buktiTransferURL}" onclick="openLightbox('${r.buktiTransferURL}')">`
      : '<span style="font-size:11px;color:var(--text-secondary)">-</span>';
    return `<tr>
      <td style="font-weight:600;color:var(--text-secondary)">${no}</td>
      <td style="white-space:nowrap;font-size:12px">${r.timestamp}</td>
      <td style="font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.nama}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${r.uraian}</td>
      <td style="font-weight:700;color:var(--success);white-space:nowrap">${formatRupiah(r.nominal)}</td>
      <td>${buktiHtml}</td>
      <td style="font-size:11px;color:var(--text-secondary)">${(r.createdBy||'').split('@')[0]}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-outline btn-sm btn-icon" onclick='editRow(${JSON.stringify(r)})' title="Edit">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteRow('${r.id}','${r.nama}')" title="Hapus">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function changePage(p) { currentPage = p; loadData(); }
function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { currentPage = 1; loadData(); }, 400); }

function previewNominal() {
  const val = parseFloat(document.getElementById('fNominal').value) || 0;
  const el = document.getElementById('nomPreview');
  el.style.display = val > 0 ? 'block' : 'none';
  el.textContent = formatRupiah(val);
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    selectedBuktiBase64 = ev.target.result.split(',')[1];
    selectedBuktiMime = file.type;
    document.getElementById('previewBuktiImg').src = ev.target.result;
    document.getElementById('previewBukti').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeFile() {
  selectedBuktiBase64 = null; selectedBuktiMime = null;
  document.getElementById('previewBukti').style.display = 'none';
  document.getElementById('previewBuktiImg').src = '';
}

async function saveData() {
  const id = document.getElementById('editId').value;
  const ts = document.getElementById('fTimestamp').value;
  const nama = document.getElementById('fNama').value.trim();
  const uraian = document.getElementById('fUraian').value.trim();
  const nominal = document.getElementById('fNominal').value;
  if (!ts || !nama || !uraian || !nominal || Number(nominal) <= 0) { showToast('Semua field wajib diisi.','error'); return; }
  
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  
  const res = await callAPI(id ? 'updatePemasukan' : 'addPemasukan', {
    id, timestamp: ts, nama, uraian, nominal: Number(nominal),
    buktiBase64: selectedBuktiBase64, buktiMimeType: selectedBuktiMime
  });
  
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Simpan';
  
  if (res.success) { showToast(res.message, 'success'); closeModal('modalAdd'); resetForm(); loadData(); }
  else showToast(res.error,'error');
}

function editRow(row) {
  document.getElementById('editId').value = row.id;
  document.getElementById('modalTitle').textContent = 'Edit Pendapatan';
  document.getElementById('fTimestamp').value = row.timestamp?.replace(' ','T').substring(0,16) || '';
  document.getElementById('fNama').value = row.nama;
  document.getElementById('fUraian').value = row.uraian;
  document.getElementById('fNominal').value = row.nominal;
  previewNominal();
  openModal('modalAdd');
}

async function deleteRow(id, nama) {
  confirmAction(`Hapus pendapatan dari "${nama}"?`, async () => {
    const res = await callAPI('deletePemasukan', { id });
    if (res.success) { showToast('Pendapatan dihapus.','success'); loadData(); }
    else showToast(res.error,'error');
  });
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('modalTitle').textContent = 'Tambah Pendapatan';
  ['fNama','fUraian','fNominal'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('nomPreview').style.display = 'none';
  removeFile(); setDefaultDT();
}

function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Laporan Pendapatan', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Dicetak: ' + new Date().toLocaleString('id-ID'), 14, 26);
  const rows = [];
  document.querySelectorAll('#tableBody tr').forEach(tr => {
    const tds = tr.querySelectorAll('td');
    if (tds.length >= 5) rows.push([tds[0].textContent, tds[1].textContent, tds[2].textContent, tds[3].textContent, tds[4].textContent]);
  });
  doc.autoTable({ head:[['No','Tanggal','Nama','Uraian','Nominal']], body: rows, startY:32, styles:{fontSize:9}, headStyles:{fillColor:[16,185,129],textColor:255,fontStyle:'bold'}, alternateRowStyles:{fillColor:[240,253,244]} });
  doc.save('Pendapatan_' + new Date().toLocaleDateString('id-ID').replace(/\//g,'-') + '.pdf');
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => initPage('pemasukan'));
</script>
</body>
</html>
